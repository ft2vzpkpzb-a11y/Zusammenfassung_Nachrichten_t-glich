name: Sonde Senat (temporär)

on:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/sonde.yml"]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Senat-Quellen abfragen
        shell: python
        run: |
          import json, sys, urllib.request, urllib.error
          sys.path.insert(0, ".")
          from briefing.fetch import BENUTZER_AGENT

          def hole(url, n=1200):
              print("\n=====", url.replace("DEMO_KEY", "DEMO"))
              req = urllib.request.Request(url, headers={"User-Agent": BENUTZER_AGENT, "Accept": "application/json, application/xml, */*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text = r.read().decode("utf-8", "replace")
                      print("status", r.status, "| ratelimit", r.headers.get("X-RateLimit-Remaining"))
                      print(text[:n])
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, e.headers.get("Server"), e.read()[:200])
              except Exception as e:
                  print("FEHLER", repr(e))

          hole("https://www.senate.gov/legislative/LIS/roll_call_lists/vote_menu_119_2.xml", 300)
          hole("https://www.senate.gov/legislative/votes_new.htm", 200)
          hole("https://api.congress.gov/v3/senate-vote/119/2?api_key=DEMO_KEY&format=json&limit=3", 2500)
