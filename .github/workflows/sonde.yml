name: Sonde Gesetzgebung (temporär)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/sonde.yml"]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Quellen abfragen
        shell: python
        run: |
          import json, re, urllib.request, urllib.error
          UA = "Mozilla/5.0 (compatible; Nachrichten-Briefing/1.0; +https://github.com/ft2vzpkpzb-a11y/Zusammenfassung_Nachrichten_t-glich)"

          def hole(url, body=None, n=1500, zeige=True, methode=None):
              daten = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=daten, method=methode, headers={
                  "User-Agent": UA, "Accept": "application/json, application/xml, text/xml, */*",
                  **({"Content-Type": "application/json"} if daten else {})})
              print("\n=====", methode or ("POST" if daten else "GET"), url)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      roh = r.read()
                      print("status", r.status, "| type", r.headers.get("Content-Type"), "| len", len(roh))
                      text = roh.decode("utf-8", "replace")
                      if zeige: print(text[:n])
                      return text
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code)
              except Exception as e:
                  print("FEHLER", repr(e))

          # --- Nationalrat: jüngste Beschlüsse ---
          t = hole("https://www.parlament.gv.at/Filter/api/filter/data/101?js=eval&showAll=true",
                   {"NRBR": ["NR"], "GP_CODE": ["XXVIII"], "VHG": ["BNR"]}, zeige=False)
          d = json.loads(t)
          print([h["label"] for h in d["header"]])
          zeilen = sorted(d["rows"], key=lambda r: r[8] or "", reverse=True)
          for r in zeilen[:25]:
              print(r[1], r[4], r[7], "|", r[6][:90], "|", r[14], "|", r[22])
          from collections import Counter
          print("Sitzungstage:", Counter(r[4] for r in zeilen if r[1] == "BNR").most_common(12))

          # Bezugs-Regierungsvorlage: gibt es dort ein Abstimmungsergebnis?
          j = hole("https://www.parlament.gv.at/gegenstand/XXVIII/I/539?json=true", zeige=False)
          if j:
              dj = json.loads(j)
              c = dj.get("content", {})
              print("keys", list(c))
              print("stages", json.dumps(c.get("stages"), ensure_ascii=False)[:4000])
              for k in c:
                  s = json.dumps(c[k], ensure_ascii=False)
                  if re.search(r"(?i)abstimm|dafür|dagegen|einstimmig|mehrheit", s):
                      print("TREFFER in", k, s[:3000])

          # --- House: wie findet man die jüngste Abstimmung ohne Schlüssel? ---
          hole("https://clerk.house.gov/Votes", n=200, zeige=False)
          v = hole("https://clerk.house.gov/Votes", zeige=False) or ""
          print(sorted(set(re.findall(r"/Votes/(\d{4}\d+)", v)))[-10:], re.findall(r"[Rr]oll [Cc]all[^<]{0,40}", v)[:5])
          for n in (300, 314, 320, 340, 400):
              hole(f"https://clerk.house.gov/evs/2026/roll{n:03d}.xml", zeige=False, methode="HEAD")
          x = hole("https://clerk.house.gov/evs/2026/roll314.xml", zeige=False) or ""
          print(x[:1200])

          # --- congress.gov RSS ---
          r = hole("https://www.congress.gov/rss", zeige=False) or ""
          print(sorted(set(re.findall(r"https://www\.congress\.gov/rss/[\w\-/]+\.xml", r))))
          for f in ("house-floor-today", "senate-floor-today", "presented-to-president"):
              hole(f"https://www.congress.gov/rss/{f}.xml", n=2500)
